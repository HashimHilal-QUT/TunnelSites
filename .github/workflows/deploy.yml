name: Local CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-to-localhost:
    runs-on: self-hosted # Runs locally on your WSL machine!

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull and Restart Stack with Docker Compose
        run: |
          echo "Stopping existing containers..."
          docker compose down
          
          echo "Building and starting fresh containers..."
          docker compose up -d --build
          
          echo "Deployment complete on localhost!"